<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Form Absensi Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .notice-backdrop { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:22px; background:rgba(15,23,42,.58); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); opacity:0; visibility:hidden; transition:opacity .22s ease, visibility .22s ease; }
        .notice-backdrop.show { opacity:1; visibility:visible; }
        .notice-card { width:100%; max-width:340px; background:#fff; border-radius:24px; padding:28px 24px 22px; text-align:center; box-shadow:0 24px 70px rgba(15,23,42,.25); transform:translateY(12px) scale(.97); transition:transform .22s ease; }
        .notice-backdrop.show .notice-card { transform:translateY(0) scale(1); }
        .notice-icon { width:68px; height:68px; margin:0 auto 17px; display:flex; align-items:center; justify-content:center; border-radius:22px; }
        .notice-icon.success { background:#dcfce7; color:#15803d; }
        .notice-icon.error { background:#fee2e2; color:#b91c1c; }
        .notice-icon.info { background:#dbeafe; color:#1d4ed8; }
        .notice-action { width:100%; border:0; border-radius:14px; padding:13px 18px; color:white; font-weight:700; font-size:14px; background:linear-gradient(135deg,#2563eb,#4f46e5); box-shadow:0 8px 18px rgba(37,99,235,.22); }
        .notice-action:active { transform:scale(.98); }
        @media(prefers-reduced-motion:reduce) { .notice-backdrop,.notice-card { transition:none; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-100 my-auto p-5 sm:p-6 space-y-5">
        <div class="text-center pb-2 border-b border-slate-100">
            <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-xs font-semibold rounded-full mb-1">PRESENSI KEGIATAN</span>
            <h2 id="activeEventName" class="text-lg font-bold text-slate-900">Memuat Kegiatan...</h2>
            <p id="activeEventDates" class="text-xs text-slate-500 mt-0.5">Memuat jadwal...</p>
        </div>

        <form id="attendanceForm" onsubmit="submitAttendance(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nama Lengkap</label>
                <input type="text" id="nama" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50" placeholder="Masukkan nama lengkap">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Jenis Identitas</label>
                <select id="jenisIdentitas" required onchange="updateIdentityLabel()" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50">
                    <option value="NIP">NIP (Nomor Induk Pegawai)</option>
                    <option value="NIK">NIK (Nomor Induk Kependudukan)</option>
                </select>
                <label id="identityLabel" for="nip_nik" class="block text-xs font-semibold uppercase text-slate-500 mb-1 mt-3">Nomor NIP</label>
                <input type="text" id="nip_nik" required inputmode="numeric" autocomplete="off" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50" placeholder="Masukkan nomor NIP">
            </div>
            <div>
                <label for="instansi" class="block text-xs font-semibold uppercase text-slate-500 mb-1">Asal Sekolah / Instansi</label>
                <input type="text" id="instansi" list="instansiOptions" required autocomplete="off" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50" placeholder="Ketik nama sekolah / instansi...">
                <datalist id="instansiOptions"><option value="">Memuat daftar instansi...</option></datalist>
                <p class="text-[11px] text-slate-500 mt-1">Ketik beberapa huruf, lalu pilih nama yang sesuai dari daftar saran.</p>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Jabatan</label>
                <input type="text" id="jabatan" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50" placeholder="Contoh: Guru / Kepala Sekolah / Staf">
            </div>

            <!-- Foto hanya dibuka setelah tombol diklik; foto belum dikirim sampai form disubmit -->
            <div class="space-y-2 pt-1">
                <label class="block text-xs font-semibold uppercase text-slate-500">Foto Kehadiran (Wajib)</label>
                <div id="photoPlaceholder" class="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-5 text-center text-sm text-slate-500">Foto belum diambil</div>
                <img id="photoPreview" alt="Pratinjau foto kehadiran" class="hidden w-full max-h-72 object-contain rounded-xl border border-slate-200 bg-slate-100">
                <div class="flex gap-2">
                    <button type="button" onclick="openCamera()" id="openCameraBtn" class="flex-1 py-3 rounded-xl bg-slate-800 text-white text-sm font-semibold">📷 Ambil Foto</button>
                    <button type="button" onclick="removePhoto()" id="removePhotoBtn" class="hidden px-4 py-3 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">Hapus Foto</button>
                </div>
            </div>

            <div class="hidden" aria-hidden="true">
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Koordinat GPS (Otomatis)</label>
                <div class="flex items-center space-x-2">
                    <input type="text" id="gps" readonly required tabindex="-1" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-xs text-slate-600 font-mono" placeholder="Mendeteksi lokasi GPS...">
                    <button type="button" onclick="getGPS()" tabindex="-1" class="px-3 py-2.5 bg-slate-200 hover:bg-slate-300 rounded-xl text-xs font-semibold shrink-0 transition">Refresh</button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-blue-500/30 active:scale-[0.99]">Kirim Absensi</button>
        </form>
    </div>

    <footer class="text-center text-xs text-slate-400 py-2">
        Aplikasi Absensi Netlify &copy; 2026
    </footer>

    <!-- Popup kamera -->
    <div id="cameraModal" class="notice-backdrop" role="dialog" aria-modal="true" aria-labelledby="cameraTitle" onclick="if(event.target===this) closeCamera()">
        <div class="notice-card" style="max-width:420px">
            <h3 id="cameraTitle" class="text-lg font-bold text-slate-900 mb-3">Ambil Foto Kehadiran</h3>
            <div class="rounded-xl overflow-hidden bg-slate-900 aspect-4/3 flex items-center justify-center">
                <video id="video" autoplay playsinline class="w-full h-full object-cover" style="transform:scaleX(-1)"></video>
                <canvas id="canvas" class="hidden"></canvas>
            </div>
            <div class="flex gap-2 mt-4">
                <button type="button" onclick="closeCamera()" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">Batal</button>
                <button type="button" onclick="capturePhoto()" id="captureBtn" class="flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold">Ambil Foto</button>
            </div>
        </div>
    </div>

    <!-- Notifikasi modern pengganti alert bawaan browser -->
    <div id="noticeModal" class="notice-backdrop" role="dialog" aria-modal="true" aria-labelledby="noticeTitle" aria-describedby="noticeMessage" onclick="if(event.target===this) closeNotification()">
        <div class="notice-card">
            <div id="noticeIcon" class="notice-icon success">
                <svg id="noticeSvg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
            </div>
            <h3 id="noticeTitle" class="text-xl font-bold text-slate-900">Berhasil!</h3>
            <p id="noticeMessage" class="text-sm leading-6 text-slate-500 mt-2 mb-6">Absensi Anda berhasil dikirim.</p>
            <button type="button" class="notice-action" onclick="closeNotification()">Mengerti</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzide4QtkQXxVu7YNrppc9pD14ZucWkpIp1zQdzju-ILM0HjZV5J6y1rY5JKfCBibH4TA/exec";

        let capturedPhotoBase64 = null;
        let streamObj = null;
        let currentKegiatanInfo = null;

        window.onload = function() {
            loadMasterData();
            updateIdentityLabel();
            getGPS();
        };

        async function openCamera() {
            const modal = document.getElementById('cameraModal');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Kamera tidak didukung atau halaman tidak menggunakan HTTPS.');
                stopCamera();
                streamObj = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 720 } }, audio: false });
                const video = document.getElementById('video');
                video.srcObject = streamObj;
                await video.play();
            } catch (err) {
                closeCamera();
                showNotification('Kamera tidak dapat dibuka. Pastikan menggunakan HTTPS dan izinkan akses kamera pada browser.', 'error');
            }
        }

        function stopCamera() {
            if (streamObj) {
                streamObj.getTracks().forEach(track => track.stop());
                streamObj = null;
            }
            const video = document.getElementById('video');
            if (video) video.srcObject = null;
        }

        function closeCamera() {
            stopCamera();
            document.getElementById('cameraModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        function capturePhoto() {
            const video = document.getElementById('video');
            if (!video.videoWidth || !video.videoHeight) {
                showNotification('Kamera belum siap. Tunggu sebentar lalu coba kembali.', 'info');
                return;
            }
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            const preview = document.getElementById('photoPreview');
            preview.src = capturedPhotoBase64;
            preview.classList.remove('hidden');
            document.getElementById('photoPlaceholder').classList.add('hidden');
            document.getElementById('removePhotoBtn').classList.remove('hidden');
            closeCamera();
        }

        function removePhoto() {
            capturedPhotoBase64 = null;
            const preview = document.getElementById('photoPreview');
            preview.removeAttribute('src');
            preview.classList.add('hidden');
            document.getElementById('photoPlaceholder').classList.remove('hidden');
            document.getElementById('removePhotoBtn').classList.add('hidden');
        }

        function getGPS() {
            const gpsInput = document.getElementById('gps');
            gpsInput.value = "Mencari lokasi GPS...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        gpsInput.value = `${position.coords.latitude}, ${position.coords.longitude}`;
                    },
                    (error) => {
                        gpsInput.value = "Gagal mendeteksi GPS (Aktifkan Izin Lokasi)";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                gpsInput.value = "GPS tidak didukung browser ini";
            }
        }

        function updateIdentityLabel() {
            const jenis = document.getElementById('jenisIdentitas').value;
            document.getElementById('identityLabel').textContent = 'Nomor ' + jenis;
            document.getElementById('nip_nik').placeholder = 'Masukkan nomor ' + jenis;
            document.getElementById('nip_nik').setAttribute('aria-label', 'Nomor ' + jenis);
        }

        async function loadMasterData() {
            if (
                !WEB_APP_URL ||
                WEB_APP_URL.includes("https://script.google.com/macros/library/d/19FshnfYlUdlGWDOZ7sI5bCTvPz-Dp0aoY_RohEZZnodu0Xuyi1sKKu2f/4") ||
                !WEB_APP_URL.startsWith("https://script.google.com/macros/s/") ||
                !WEB_APP_URL.endsWith("/exec")
            ) {
                document.getElementById('activeEventName').innerText =
                    "Konfigurasi URL Google Apps Script belum benar";
                return;
            }

            try {
                let response = await fetch(WEB_APP_URL + "?action=getMasterData");
                let data = await response.json();
                
                if (data.activeKegiatan) {
                    currentKegiatanInfo = data.activeKegiatan;
                    document.getElementById('activeEventName').innerText = data.activeKegiatan.nama;
                    document.getElementById('activeEventDates').innerText = `Pelaksanaan: ${formatTanggal(data.activeKegiatan.tglMulai)} s/d ${formatTanggal(data.activeKegiatan.tglSelesai)}`;
                } else {
                    document.getElementById('activeEventName').innerText = "Belum Ada Kegiatan Aktif";
                    document.getElementById('activeEventDates').innerText = "Silakan atur kegiatan pada Portal Master Admin";
                }
                
                const options = document.getElementById('instansiOptions');
                options.innerHTML = '';
                window.instansiValidList = [];
                if (data.instansiList && Array.isArray(data.instansiList)) {
                    const uniqueInstansi = [...new Set(data.instansiList.map(item => String(item).trim()).filter(Boolean))];
                    window.instansiValidList = uniqueInstansi;
                    uniqueInstansi.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item;
                        options.appendChild(opt);
                    });
                }
                document.getElementById('instansi').placeholder = window.instansiValidList.length
                    ? 'Ketik nama sekolah / instansi...'
                    : 'Daftar instansi belum tersedia';
            } catch(e) {
                document.getElementById('activeEventName').innerText = "Gagal Memuat Kegiatan Aktif";
            }
        }

        async function submitAttendance(e) {
            e.preventDefault();
            const form = document.getElementById('attendanceForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                showNotification('Lengkapi semua kolom wajib sebelum mengirim absensi.', 'info');
                return;
            }
            const identityNumber = document.getElementById('nip_nik').value.trim();
            if (!/^\d+$/.test(identityNumber)) {
                showNotification('Nomor NIP/NIK hanya boleh berisi angka.', 'info');
                document.getElementById('nip_nik').focus();
                return;
            }
            if (!capturedPhotoBase64) {
                showNotification("Silakan ambil foto selfie menggunakan kamera depan terlebih dahulu.", "info");
                return;
            }

            if (!currentKegiatanInfo) {
                showNotification("Tidak ada kegiatan aktif saat ini. Minta Admin untuk mengaktifkan kegiatan.", "error");
                return;
            }

            const instansiDipilih = document.getElementById('instansi').value.trim();
            const daftarInstansi = window.instansiValidList || [];
            const cocok = daftarInstansi.find(item => item.toLocaleLowerCase('id-ID') === instansiDipilih.toLocaleLowerCase('id-ID'));
            if (!cocok) {
                showNotification("Silakan ketik lalu pilih Asal Sekolah / Instansi yang tersedia pada daftar saran.", "info");
                document.getElementById('instansi').focus();
                return;
            }
            if (!document.getElementById('gps').value || /Mencari|Gagal|tidak didukung/i.test(document.getElementById('gps').value)) {
                showNotification("Koordinat GPS belum berhasil dideteksi. Aktifkan izin lokasi lalu coba lagi.", "error");
                getGPS();
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Mengirim Absensi...";

            const payload = {
                action: "saveAttendance",
                kegiatan: currentKegiatanInfo.nama,
                tglKegiatan: `${currentKegiatanInfo.tglMulai} s/d ${currentKegiatanInfo.tglSelesai}`,
                nama: document.getElementById('nama').value,
                nip_nik: document.getElementById('nip_nik').value,
                instansi: cocok,
                jabatan: document.getElementById('jabatan').value,
                gps: document.getElementById('gps').value,
                photo: capturedPhotoBase64
            };

            try {
                let res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                let result = await res.json();
                const berhasil = result.status === "success";
                showNotification(result.message || (berhasil ? "Absensi berhasil dikirim!" : "Absensi belum berhasil dikirim."), berhasil ? "success" : "error", berhasil ? "Absensi Terkirim!" : "Pengiriman Gagal");
                if (!berhasil) return;
                document.getElementById('attendanceForm').reset();
                removePhoto();
                updateIdentityLabel();
                getGPS();
            } catch(err) {
                showNotification("Terjadi kesalahan saat mengirim data absensi. Periksa koneksi internet lalu coba lagi.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Kirim Absensi";
            }
        }

        function showNotification(message, type = "success", title = "") {
            const modal = document.getElementById("noticeModal");
            const icon = document.getElementById("noticeIcon");
            const svg = document.getElementById("noticeSvg");
            const heading = document.getElementById("noticeTitle");
            const success = type === "success";
            const error = type === "error";
            icon.className = "notice-icon " + (success ? "success" : error ? "error" : "info");
            heading.textContent = title || (success ? "Berhasil!" : error ? "Perlu Perhatian" : "Informasi");
            document.getElementById("noticeMessage").textContent = message;
            svg.innerHTML = success
                ? '<path d="m5 12 4 4L19 6"/>'
                : error
                    ? '<path d="M12 8v4m0 4h.01"/><circle cx="12" cy="12" r="9"/>'
                    : '<path d="M12 8h.01M11 12h1v4h1"/><circle cx="12" cy="12" r="9"/>';
            modal.classList.add("show");
            document.body.style.overflow = "hidden";
            const button = modal.querySelector("button");
            if (button) button.focus();
        }

        function closeNotification() {
            const modal = document.getElementById("noticeModal");
            modal.classList.remove("show");
            document.body.style.overflow = "";
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") { closeNotification(); closeCamera(); }
        });

        function formatTanggal(str) {
            if (!str) return "-";
            let d = new Date(str);
            if (isNaN(d.getTime())) return str;
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }
    </script>
</body>
</html>
