<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Form Absensi Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-100 my-auto p-5 sm:p-6 space-y-5">
        <div class="text-center pb-2 border-b border-slate-100">
            <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-xs font-semibold rounded-full mb-1">PRESENSI PESERTA</span>
            <h2 id="activeEventName" class="text-lg font-bold text-slate-900">Memuat Kegiatan...</h2>
            <p id="activeEventDates" class="text-xs text-slate-500 mt-0.5">Memuat jadwal...</p>
        </div>

        <form id="attendanceForm" onsubmit="submitAttendance(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nama Lengkap</label>
                <input type="text" id="nama" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50" placeholder="Masukkan nama lengkap">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">NIP / NIK</label>
                <input type="text" id="nip_nik" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50" placeholder="Nomor NIP atau NIK (jika tidak ada NIP)">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Asal Sekolah / Instansi</label>
                <select id="instansi" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50">
                    <option value="">Memuat daftar instansi...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Jabatan</label>
                <input type="text" id="jabatan" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50/50" placeholder="Contoh: Guru / Kepala Sekolah / Staf">
            </div>

            <!-- Kamera Depan Direct View -->
            <div class="space-y-2 pt-1">
                <label class="block text-xs font-semibold uppercase text-slate-500">Ambil Foto (Kamera Depan)</label>
                <div class="relative rounded-xl overflow-hidden bg-slate-900 aspect-4/3 flex items-center justify-center border border-slate-200 shadow-inner">
                    <video id="video" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                    <canvas id="canvas" class="hidden"></canvas>
                    <img id="photoPreview" class="hidden w-full h-full object-cover transform -scale-x-100 absolute inset-0">
                    <button type="button" onclick="capturePhoto()" id="captureBtn" class="absolute bottom-3 bg-white/90 hover:bg-white text-slate-800 font-medium px-4 py-2 rounded-full text-xs shadow-lg backdrop-blur transition active:scale-95">Ambil Foto</button>
                    <button type="button" onclick="retakePhoto()" id="retakeBtn" class="hidden absolute bottom-3 bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-full text-xs shadow-lg transition active:scale-95">Ulangi Foto</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Koordinat GPS (Otomatis)</label>
                <div class="flex items-center space-x-2">
                    <input type="text" id="gps" readonly required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-xs text-slate-600 font-mono" placeholder="Mendeteksi lokasi GPS...">
                    <button type="button" onclick="getGPS()" class="px-3 py-2.5 bg-slate-200 hover:bg-slate-300 rounded-xl text-xs font-semibold shrink-0 transition">Refresh</button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-blue-500/30 active:scale-[0.99]">Kirim Absensi</button>
        </form>
    </div>

    <footer class="text-center text-xs text-slate-400 py-2">
        Aplikasi Absensi Netlify &copy; 2026
    </footer>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzide4QtkQXxVu7YNrppc9pD14ZucWkpIp1zQdzju-ILM0HjZV5J6y1rY5JKfCBibH4TA/exec";

        let capturedPhotoBase64 = null;
        let streamObj = null;
        let currentKegiatanInfo = null;

        window.onload = function() {
            loadMasterData();
            startCamera();
            getGPS();
        };

        async function startCamera() {
            try {
                streamObj = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                document.getElementById('video').srcObject = streamObj;
                document.getElementById('video').classList.remove('hidden');
                document.getElementById('photoPreview').classList.add('hidden');
                document.getElementById('captureBtn').classList.remove('hidden');
                document.getElementById('retakeBtn').classList.add('hidden');
                capturedPhotoBase64 = null;
            } catch (err) {
                alert("Gagal mengakses kamera depan. Pastikan izin kamera telah diizinkan.");
            }
        }

        function stopCamera() {
            if (streamObj) {
                streamObj.getTracks().forEach(track => track.stop());
            }
        }

        function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const photoPreview = document.getElementById('photoPreview');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            photoPreview.src = capturedPhotoBase64;
            photoPreview.classList.remove('hidden');
            video.classList.add('hidden');
            
            document.getElementById('captureBtn').classList.add('hidden');
            document.getElementById('retakeBtn').classList.remove('hidden');
            stopCamera();
        }

        function retakePhoto() {
            startCamera();
        }

        function getGPS() {
            const gpsInput = document.getElementById('gps');
            gpsInput.value = "Mencari lokasi GPS...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        gpsInput.value = `${position.coords.latitude}, ${position.coords.longitude}`;
                    },
                    (error) => {
                        gpsInput.value = "Gagal mendeteksi GPS (Aktifkan Izin Lokasi)";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                gpsInput.value = "GPS tidak didukung browser ini";
            }
        }

        async function loadMasterData() {
            if (WEB_APP_URL === "https://script.google.com/macros/s/AKfycbzide4QtkQXxVu7YNrppc9pD14ZucWkpIp1zQdzju-ILM0HjZV5J6y1rY5JKfCBibH4TA/exec" || !WEB_APP_URL) {
                document.getElementById('activeEventName').innerText = "WEB_APP_URL Belum Diatur";
                return;
            }

            try {
                let response = await fetch(WEB_APP_URL + "?action=getMasterData");
                let data = await response.json();
                
                if (data.activeKegiatan) {
                    currentKegiatanInfo = data.activeKegiatan;
                    document.getElementById('activeEventName').innerText = data.activeKegiatan.nama;
                    document.getElementById('activeEventDates').innerText = `Pelaksanaan: ${formatTanggal(data.activeKegiatan.tglMulai)} s/d ${formatTanggal(data.activeKegiatan.tglSelesai)}`;
                } else {
                    document.getElementById('activeEventName').innerText = "Belum Ada Kegiatan Aktif";
                    document.getElementById('activeEventDates').innerText = "Silakan atur kegiatan pada Portal Master Admin";
                }
                
                let select = document.getElementById('instansi');
                select.innerHTML = '<option value="">Pilih Instansi / Sekolah</option>';
                if (data.instansiList && Array.isArray(data.instansiList)) {
                    data.instansiList.forEach(item => {
                        let opt = document.createElement('option');
                        opt.value = item.trim();
                        opt.innerHTML = item.trim();
                        select.appendChild(opt);
                    });
                }
            } catch(e) {
                document.getElementById('activeEventName').innerText = "Gagal Memuat Kegiatan Aktif";
            }
        }

        async function submitAttendance(e) {
            e.preventDefault();
            if (!capturedPhotoBase64) {
                alert("Silakan ambil foto selfie menggunakan kamera depan terlebih dahulu!");
                return;
            }

            if (!currentKegiatanInfo) {
                alert("Tidak ada kegiatan aktif saat ini. Minta Admin untuk mengaktifkan kegiatan.");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Mengirim Absensi...";

            const payload = {
                action: "saveAttendance",
                kegiatan: currentKegiatanInfo.nama,
                tglKegiatan: `${currentKegiatanInfo.tglMulai} s/d ${currentKegiatanInfo.tglSelesai}`,
                nama: document.getElementById('nama').value,
                nip_nik: document.getElementById('nip_nik').value,
                instansi: document.getElementById('instansi').value,
                jabatan: document.getElementById('jabatan').value,
                gps: document.getElementById('gps').value,
                photo: capturedPhotoBase64
            };

            try {
                let res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                let result = await res.json();
                alert(result.message || "Absensi berhasil dikirim!");
                document.getElementById('attendanceForm').reset();
                startCamera();
                getGPS();
            } catch(err) {
                alert("Terjadi kesalahan saat mengirim data absensi.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Kirim Absensi";
            }
        }

        function formatTanggal(str) {
            if (!str) return "-";
            let d = new Date(str);
            if (isNaN(d.getTime())) return str;
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }
    </script>
</body>
</html>
